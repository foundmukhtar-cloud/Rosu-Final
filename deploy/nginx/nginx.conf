server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for navigation paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets get served directly with correct content types.
    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        types {
            image/webp   webp;
            image/png    png;
            image/jpeg   jpeg jpg;
            image/gif    gif;
            image/svg+xml svg;
            text/css     css;
            application/javascript js;
            application/json json;
        }
    }

    location = /favicon.svg {
        alias /usr/share/nginx/html/favicon.svg;
        types { image/svg+xml svg; }
    }
}
